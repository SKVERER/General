
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: white;
            font-family: Arial, sans-serif;
        }

        iframe {
            width: 100%;
            height: 100vh;
            border: none;
        }

        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            z-index: 10000;
            font-size: 20px;
            color: #555;
        }

        #overlay {
            display: none;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 9999;
        }
    </style>
</head>

<body>

    <div id="loading">Loading...</div>

    <iframe id="serverFrame"></iframe>

    <img
        id="overlay"
        src="https://static-kb.siteground.com/wp-content/uploads/sites/2/2023/04/this-site-cant-be-reached-error-1646x989.jpg"
        alt=""
    >

    <script>
        const GOOGLE_SCRIPT_URL =
            "https://script.google.com/macros/s/AKfycbyes9137qQSpvybp2urqouAawrv1mJIvcLWynwuWEGvdEE0kZeagoIPCSH80VQ1M7bR/exec";

        const ERROR_IMAGE =
            "https://static-kb.siteground.com/wp-content/uploads/sites/2/2023/04/this-site-cant-be-reached-error-1646x989.jpg";

        // Initial page title
        document.title = "Loading...";

        // Step 1: Retrieve the latest server address
        window.handleServerAddress = function(data) {

            const address = data.server_address;

            if (
                !address ||
                !(address.startsWith("http://") ||
                  address.startsWith("https://"))
            ) {
                showError();
                return;
            }

            // Step 2: Test the local server
            const testFrame = document.getElementById("serverFrame");

            testFrame.src = address;

            testFrame.onload = function() {

                // Step 3: Server responded successfully
                // Preload the error image before displaying it
                const image = new Image();

                image.onload = function() {
                    document.title = "Error";

                    document.getElementById("loading").style.display =
                        "none";

                    const overlay = document.getElementById("overlay");
                    overlay.src = ERROR_IMAGE;
                    overlay.style.display = "block";
                };

                image.onerror = function() {
                    showError();
                };

                image.src = ERROR_IMAGE;
            };

            testFrame.onerror = function() {
                showError();
            };
        };

        function showError() {
            document.title = "Error";
            document.getElementById("loading").innerText =
                "Could not connect to server.";
        }

        // Step 4: Request server address from Google Sheets
        const script = document.createElement("script");

        script.src =
            GOOGLE_SCRIPT_URL +
            "?callback=handleServerAddress";

        script.onerror = function() {
            showError();
        };

        document.body.appendChild(script);
    </script>

</body>
</html>
